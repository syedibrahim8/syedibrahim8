# Place this file at: .github/workflows/snake.yml
# Draws your contribution graph as an animated snake and publishes it to the "output" branch.

name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#8ea2ff&color_dots=#161b26,#1f3a5f,#2b5c8a,#3f86b8,#2dd4bf&color_background=#0d1017
            dist/snake-light.svg?color_snake=#5b7cfa&color_dots=#ebedf0,#c7d2ff,#9fb0f5,#6f86f0,#2dd4bf

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
